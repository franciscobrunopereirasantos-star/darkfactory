name: Fábrica — custo real RunPod

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Fábrica — lote semanal (GPU)", "Fábrica — ligar GPU (API de geração)"]
    types: [completed]

jobs:
  custos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          FABRICA_URL: ${{ secrets.FABRICA_URL }}
          FABRICA_WORKER_TOKEN: ${{ secrets.FABRICA_WORKER_TOKEN }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: node src/custos-runpod.mjs
